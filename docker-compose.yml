# prod docker yaml
services:
  # -----------------------------------------------------------
  # 1. DATABASE: PostgreSQL
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: wavepipe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wavepipe_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-wavepipe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-wavepipe}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # 2. QUEUE BROKER: Redis
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: wavepipe-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # -----------------------------------------------------------
  # 3. WEB APP: Next.js Frontend
  # -----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wavepipe-frontend
    restart: unless-stopped
    ports:
      # Defaults to port 80 for direct HTTP access in EC2 (or PORT env if set)
      - "${PORT:-80}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-wavepipe_secure_password_123}@postgres:5432/${POSTGRES_DB:-wavepipe}
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: wavepipe:jobs:transcribe
      JWT_SECRET: ${JWT_SECRET:-wavepipe_production_secret_key_change_in_prod}
    volumes:
      - shared_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -----------------------------------------------------------
  # 4. BACKGROUND WORKER: Python Whisper.cpp Worker
  # -----------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: wavepipe-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-wavepipe_secure_password_123}@postgres:5432/${POSTGRES_DB:-wavepipe}
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: wavepipe:jobs:transcribe
      WHISPER_EXECUTABLE: /usr/local/bin/whisper-cli
      WHISPER_MODEL_PATH: /app/models/ggml-base.en.bin
    volumes:
      - shared_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

# -------------------------------------------------------------
# PERSISTENT STORAGE VOLUMES
# -------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  shared_uploads:
